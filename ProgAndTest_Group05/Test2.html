<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Northbridge Public Library</title>
<style>
    /* Northbridge Public Library — stylesheet
       Order: tokens, base, login, layout, components, page-specific, motion, responsive. */

    :root {
        --primary: #2861ad;
        --bg: #f3f6fb;
        --white: #fff;
        --text: #26344a;
        --muted: #7b8798;
        --border: #e2e8f0;
        --green: #198754;
        --red: #c94a4a;
        --ink: #14213d;
        --ink-2: #1d3560;
        --accent: #f2a93b;
        --display: Georgia,"Times New Roman",serif;
        --shadow: 0 1px 2px #14213d0d,0 8px 24px #14213d12;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font: 14px Arial,sans-serif;
        background: radial-gradient(900px 360px at 100% 0,#dfe9fa,transparent 70%) fixed,var(--bg);
        color: var(--text);
    }

    button,
    input,
    select {
        font: inherit;
    }

    button {
        cursor: pointer;
    }

    :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    .hidden {
        display: none!important;
    }

    /* Login */
    .login {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
    }

    .login-card {
        width: min(380px,100%);
        padding: 30px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        text-align: center;
    }

    .logo {
        width: 42px;
        height: 42px;
        margin: 0 auto 12px;
        display: grid;
        place-items: center;
        border-radius: 11px;
        background: linear-gradient(135deg,#3573c4,var(--ink-2));
        color: var(--white);
    }

    .login-card h1 {
        font: 700 22px var(--display);
        color: var(--ink);
    }

    .login-card p {
        color: var(--muted);
        font-size: 12px;
    }

    .field {
        text-align: left;
        margin: 12px 0;
    }

    .field label {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        font-weight: bold;
    }

    input,
    select {
        width: 100%;
        height: 38px;
        padding: 8px 10px;
        border: 1px solid #dbe3ef;
        border-radius: 6px;
        background: var(--white);
    }

    /* Layout */
    .topbar {
        height: 62px;
        padding: 0 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--white);
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow);
        position: relative;
        z-index: 1;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-weight: bold;
    }

    .brand .logo {
        width: 32px;
        height: 32px;
        margin: 0;
        font-size: 15px;
    }

    .brand small {
        display: block;
        color: var(--muted);
        font-size: 10px;
    }

    .top-actions {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg,var(--accent),#e0566e);
        color: var(--white);
        font-weight: bold;
    }

    .layout {
        min-height: calc(100vh - 62px);
        display: flex;
    }

    .sidebar {
        width: 220px;
        padding: 16px 12px;
        background: linear-gradient(180deg,var(--ink-2),var(--ink));
    }

    .nav {
        display: grid;
        gap: 4px;
    }

    .nav button {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        text-align: left;
        background: transparent;
        color: #b9c6e0;
        transition: background .15s,color .15s,transform .15s;
    }

    .nav button:hover {
        background: #ffffff14;
        color: var(--white);
        transform: translateX(2px);
    }

    .nav button.active {
        background: #ffffff1f;
        color: var(--white);
        font-weight: bold;
    }

    .nav button.active::before {
        content: "";
        position: absolute;
        left: -12px;
        top: 8px;
        bottom: 8px;
        width: 4px;
        border-radius: 0 4px 4px 0;
        background: var(--accent);
    }

    .ni {
        width: 20px;
        text-align: center;
    }

    .main {
        flex: 1;
        min-width: 0;
        padding: 22px 24px;
    }

    .crumb {
        color: var(--muted);
        font-size: 11px;
    }

    .heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin: 5px 0 16px;
    }

    .heading h1 {
        margin: 0;
        font: 700 27px/1.15 var(--display);
        color: var(--ink);
    }

    .heading p {
        margin: 5px 0;
        color: var(--muted);
        font-size: 12px;
    }

    /* Grids and cards */
    .grid4 {
        display: grid;
        grid-template-columns: repeat(4,1fr);
        gap: 14px;
    }

    .grid2 {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 14px;
    }

    .grid-half {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }

    .card {
        padding: 16px;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
    }

    .card h2 {
        margin: 0 0 12px;
        font: 700 16px var(--display);
        color: var(--ink);
    }

    .stat-label {
        color: var(--muted);
        font-size: 11px;
    }

    .stat-value {
        margin: 6px 0 4px;
        font: 700 28px var(--display);
        color: var(--tone,var(--ink));
    }

    .stat-note {
        color: var(--muted);
        font-size: 10px;
    }

    /* Buttons, toolbar, tables, badges */
    .btn {
        min-height: 36px;
        padding: 8px 12px;
        border: 1px solid var(--primary);
        border-radius: 6px;
        background: linear-gradient(180deg,#3573c4,var(--primary));
        color: var(--white);
        font-size: 12px;
        font-weight: bold;
        transition: filter .15s,transform .1s,box-shadow .15s;
    }

    .btn:hover {
        filter: brightness(1.08);
        box-shadow: 0 4px 12px #2861ad40;
    }

    .btn:active {
        transform: translateY(1px);
    }

    .btn.secondary {
        border-color: var(--border);
        background: var(--white);
        color: var(--text);
    }

    .btn.small {
        min-height: 28px;
        padding: 4px 8px;
    }

    .toolbar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
    }

    .toolbar>* {
        flex: 1;
    }

    .toolbar button {
        flex: none;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th,
    td {
        padding: 9px 7px;
        border-bottom: 1px solid #edf1f5;
        text-align: left;
        font-size: 12px;
    }

    th {
        color: var(--muted);
        font-size: 10px;
    }

    .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 9px;
        border-radius: 15px;
        font-size: 10px;
        font-weight: bold;
    }

    .badge::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
    }

    .green {
        background: #e5f4ec;
        color: var(--green);
    }

    .red {
        background: #fdeaea;
        color: var(--red);
    }

    .yellow {
        background: #fff3d6;
        color: #9a680a;
    }

    .blue {
        background: #e8effa;
        color: var(--primary);
    }

    .notice {
        margin-top: 12px;
        padding: 12px;
        border-radius: 10px;
        border-left: 4px solid var(--accent);
        background: #fff8e8;
        border: 1px solid #eee1b9;
        color: #805f20;
        font-size: 12px;
    }

    .link {
        border: 0;
        background: none;
        color: var(--primary);
        font-weight: bold;
    }

    .stack {
        display: grid;
        gap: 14px;
    }

    .actions {
        display: flex;
        gap: 8px;
    }

    .table-wrap {
        overflow-x: auto;
    }

    .mt {
        margin-top: 14px;
    }

    .mb {
        margin-bottom: 14px;
    }

    /* Toast and chart */
    .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        padding: 12px 16px;
        border-radius: 7px;
        background: #26344a;
        color: var(--white);
        opacity: 0;
        transform: translateY(20px);
        transition: .2s;
    }

    .toast.show {
        opacity: 1;
        transform: none;
    }

    .chart {
        height: 140px;
        display: flex;
        align-items: flex-end;
        gap: 12px;
        padding: 12px 12px 0;
        margin-bottom: 22px;
        border-bottom: 1px solid var(--border);
    }

    .bcol {
        position: relative;
        flex: 1;
        height: 100%;
        display: flex;
        align-items: flex-end;
    }

    .bcol span {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -19px;
        text-align: center;
        font-size: 10px;
        color: var(--muted);
    }

    .bar {
        width: 100%;
        border-radius: 6px 6px 0 0;
        background: linear-gradient(180deg,#5d94dc,var(--primary));
        transform-origin: bottom;
        transition: filter .15s;
    }

    .bar.peak {
        background: linear-gradient(180deg,#ffc766,var(--accent));
    }

    .bcol:hover .bar {
        filter: brightness(1.12);
    }

    /* Login hero */
    .login-hero {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: radial-gradient(600px 420px at 30% 20%,#2f6fc7,transparent),linear-gradient(160deg,var(--ink-2),var(--ink));
    }

    .login-hero::before {
        content: "📚";
        position: absolute;
        top: 14%;
        left: 50%;
        font-size: 76px;
        transform: translateX(-50%);
        filter: drop-shadow(0 10px 24px #0008);
    }

    .shelf {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 50%;
        padding: 0 18px;
        border-bottom: 10px solid #0b1428;
    }

    .spine {
        width: 38px;
        height: var(--h);
        border-radius: 4px 4px 0 0;
        background: var(--c);
        box-shadow: inset -6px 0 0 #0002,inset 0 10px 0 #ffffff25;
        transform-origin: bottom;
        animation: grow .8s cubic-bezier(.2,.8,.2,1) both;
        animation-delay: calc(var(--i)*70ms);
    }

    .login-pane {
        display: grid;
        place-items: center;
        padding: 20px;
        background: #edf2fa;
    }

    input:focus,
    select:focus {
        outline: 0;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px #2861ad22;
    }

    /* Topbar status chip */
    .top-actions .role {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 20px;
        background: #e5f4ec;
        color: var(--green);
        font-size: 12px;
        font-weight: bold;
    }

    .top-actions .role::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        animation: pulse 2s infinite;
    }

    /* Stat cards */
    .grid4 .card {
        position: relative;
        min-height: 96px;
        padding: 16px 16px 16px 76px;
        transition: transform .2s,box-shadow .2s;
    }

    .grid4 .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px #14213d1f;
    }

    .grid4 .card::before {
        content: attr(data-icon);
        position: absolute;
        left: 16px;
        top: 50%;
        width: 44px;
        height: 44px;
        margin-top: -22px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        font-size: 22px;
        background: var(--tint);
    }

    .grid4 .card:nth-child(1) {
        --tint: #e3edfc;
        --tone: #2861ad;
    }

    .grid4 .card:nth-child(2) {
        --tint: #dff5f3;
        --tone: #14a09b;
    }

    .grid4 .card:nth-child(3) {
        --tint: #fdf0d5;
        --tone: #b9770e;
    }

    .grid4 .card:nth-child(4) {
        --tint: #fde5ea;
        --tone: #d03f5b;
    }

    /* Tables, toast */
    tbody tr {
        transition: background .15s;
    }

    tbody tr:hover {
        background: #f4f8fe;
    }

    .toast {
        background: var(--ink);
        border-left: 4px solid var(--accent);
        border-radius: 10px;
        box-shadow: 0 10px 30px #14213d40;
    }

    /* Motion */
    .main.enter>* {
        animation: fadeUp .45s cubic-bezier(.2,.8,.2,1) both;
    }

    .main.enter>:nth-child(2) {
        animation-delay: .05s;
    }

    .main.enter>:nth-child(3) {
        animation-delay: .1s;
    }

    .main.enter>:nth-child(4) {
        animation-delay: .15s;
    }

    .main.enter>:nth-child(n+5) {
        animation-delay: .2s;
    }

    .bar {
        animation: grow .6s cubic-bezier(.2,.8,.2,1) both;
        animation-delay: calc(var(--i)*60ms);
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
    }

    @keyframes grow {
        from {
            transform: scaleY(0);
        }
    }

    @keyframes pulse {
        50% {
            opacity: .35;
        }
    }

    @media (max-width:820px) {
        .login {
            grid-template-columns: 1fr;
        }
        .login-hero {
            display: none;
        }
    }

    @media (prefers-reduced-motion:reduce) {
        * {
            animation: none!important;
            transition: none!important;
        }
    }

    /* Utilities */
    .btn.block {
        width: 100%;
    }

    .figure {
        float: right;
    }

    .clickable {
        cursor: pointer;
    }

    .card h2.text-right {
        text-align: right;
    }

    .card h2.mt-lg {
        margin-top: 20px;
    }

    .mb-sm {
        margin-bottom: 10px;
    }

    @media (max-width:900px) {
        .grid4 {
            grid-template-columns: 1fr 1fr;
        }
        .grid2,
        .grid-half {
            grid-template-columns: 1fr;
        }
        .sidebar {
            width: 175px;
        }
    }

    @media (max-width:620px) {
        .top-actions .role {
            display: none;
        }
        .layout {
            display: block;
        }
        .sidebar {
            width: 100%;
            overflow-x: auto;
        }
        .nav {
            display: flex;
        }
        .nav button {
            white-space: nowrap;
        }
        .nav button.active::before {
            display: none;
        }
        .main {
            padding: 16px 12px;
        }
        .grid4 {
            grid-template-columns: 1fr;
        }
    }
    </style>
</head>
<body>
<section id="login" class="login">
  <div class="login-hero" aria-hidden="true"><div class="shelf"><i class="spine" style="--h:78%;--c:#f2a93b;--i:0"></i><i class="spine" style="--h:92%;--c:#e0566e;--i:1"></i><i class="spine" style="--h:64%;--c:#14a09b;--i:2"></i><i class="spine" style="--h:86%;--c:#5d94dc;--i:3"></i><i class="spine" style="--h:70%;--c:#f7d9a0;--i:4"></i><i class="spine" style="--h:96%;--c:#7a5af8;--i:5"></i><i class="spine" style="--h:58%;--c:#f2a93b;--i:6"></i><i class="spine" style="--h:82%;--c:#3573c4;--i:7"></i><i class="spine" style="--h:74%;--c:#e0566e;--i:8"></i><i class="spine" style="--h:90%;--c:#14a09b;--i:9"></i></div></div>
  <div class="login-pane">
  <form id="loginForm" class="login-card">
    <div class="logo">📚</div>
    <h1>Library Management System</h1>
    <p>Northbridge Public Library</p>
    <div class="field"><label for="username">Username</label><input id="username" value="sarah.mitchell" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" value="123456" required></div>
    <div class="field">
      <label for="role">Role</label>
      <select id="role"><option>Librarian</option><option>Reader</option><option>Administrator</option></select>
    </div>
    <button class="btn block">Sign In</button>
    <p><button type="button" class="link" id="showRegister">Create an account</button> · <button type="button" class="link" id="showForgot">Forgot password?</button></p>
  </form>
  <form id="registerForm" class="login-card hidden">
    <div class="logo">📝</div>
    <h1>Create Reader Account</h1>
    <p>Join Northbridge Public Library</p>
    <div class="field"><label for="regName">Full name</label><input id="regName" name="name" required></div>
    <div class="field"><label for="regEmail">Email</label><input id="regEmail" name="email" type="email" required></div>
    <div class="field"><label for="regUser">Username</label><input id="regUser" name="user" autocomplete="username" required></div>
    <div class="field"><label for="regPass">Password</label><input id="regPass" name="pass" type="password" autocomplete="new-password" required></div>
    <div class="field"><label for="regConfirm">Confirm password</label><input id="regConfirm" name="confirm" type="password" autocomplete="new-password" required></div>
    <div class="field"><label for="regRole">Account role</label><select id="regRole" name="role"><option>Reader</option><option>Librarian</option><option>Administrator</option></select></div>
    <div class="field"><label for="regType">Membership type</label><select id="regType" name="type"><option>Adult</option><option>Student</option></select></div>
    <div class="notice" id="regFee"></div>
    <button class="btn block">Create Account</button>
    <p><button type="button" class="link" id="showLogin">Back to sign in</button></p>
  </form>
  </div>
</section>

<div id="app" class="hidden">
  <header class="topbar">
    <div class="brand">
      <span class="logo">📚</span>
      <span>Northbridge Public Library<small>Library Management System</small></span>
    </div>
    <div class="top-actions">
      <select id="switchRole" aria-label="Switch role" title="Switch role" style="width:auto;height:30px;padding:2px 8px"><option>Librarian</option><option>Reader</option><option>Administrator</option></select>
      <span class="avatar" id="avatar">SM</span>
      <strong id="displayName">Sarah Mitchell</strong>
      <button class="link" id="logout">Sign Out</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar"><nav id="nav" class="nav" aria-label="Main menu"></nav></aside>
    <main id="main" class="main"></main>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
    "use strict";

    /**
     * config.js — Constants, role menus and seed data. Loaded first.
     */

    const STORAGE_KEY = "northbridge-data-v2";
    const TODAY_DATE = new Date(2026, 10, 19);
    const OVERDUE_DAYS = 7;
    const DEMO_PASSWORD = "123456";
    const DAMAGE_FEE = 5, LOST_FEE = 20;
    const TOAST_MS = 2200;
    const COUNT_UP_MS = 700;

    /** Status labels shared by the data, the business rules and the badges. */
    const STATUS = {
      ACTIVE: "Active",
      OVERDUE: "Overdue",
      ON_LOAN: "On loan",
      UNPAID: "Unpaid",
      PAID: "Paid",
      WAIVED: "Waived",
      READY: "Ready for pickup",
      QUEUED: "In queue"
    };
    const formatDate = (d) => `${d.getDate()} ${d.toLocaleString("en-US", { month: "short" })} ${d.getFullYear()}`;
    const TODAY = formatDate(TODAY_DATE);

    /** Turn compact rows ([v1, v2, ...]) into objects with the given keys. */
    const rows = (keys, list) => list.map((r) => Object.fromEntries(keys.map((k, i) => [k, r[i]])));

    const DEFAULT_DATA = {
      books: rows(["title", "author", "isbn", "category", "year", "copies", "available", "shelf", "price"], [
        ["The Midnight Library", "Matt Haig", "9780525559474", "Fiction", 2020, 4, 0, "FIC-A3", 16.99],
        ["Atomic Habits", "James Clear", "9780735211292", "Self-help", 2018, 5, 2, "SH-C1", 14.50],
        ["Sapiens", "Yuval Noah Harari", "9780062316097", "History", 2015, 3, 1, "HIS-D2", 18.00],
        ["Educated", "Tara Westover", "9780399590504", "Biography", 2018, 3, 2, "BIO-B2", 15.25],
        ["Quiet", "Susan Cain", "9780307352156", "Psychology", 2012, 2, 1, "PSY-C4", 13.75]
      ]),
      readers: rows(["name", "card", "email", "type", "status", "expires"], [
        ["Emma Wilson", "R-10482", "emma@example.com", "Adult", STATUS.ACTIVE, "31 May 2027"],
        ["Liam Parker", "R-10483", "liam@example.com", "Adult", STATUS.ACTIVE, "10 Jun 2027"],
        ["Olivia Chen", "R-10484", "olivia@example.com", "Student", STATUS.ACTIVE, "5 Aug 2027"]
      ]),
      loans: rows(["book", "reader", "card", "due", "status"], [
        ["The Midnight Library", "Emma Wilson", "R-10482", "26 Oct 2026", STATUS.OVERDUE],
        ["Atomic Habits", "Emma Wilson", "R-10482", "6 Nov 2026", STATUS.ON_LOAN],
        ["Sapiens", "Liam Parker", "R-10483", "9 Nov 2026", STATUS.ON_LOAN]
      ]),
      reservations: rows(["book", "reader", "date", "status"], [
        ["Where the Crawdads Sing", "Emma Wilson", "28 Oct 2026", STATUS.READY],
        ["The Midnight Library", "Liam Parker", "29 Oct 2026", STATUS.QUEUED]
      ]),
      fines: rows(["reader", "card", "reason", "amount", "status"], [
        ["Emma Wilson", "R-10482", "7 days overdue", 3.5, STATUS.UNPAID],
        ["Noah Davis", "R-10485", "Overdue + damage", 15, STATUS.UNPAID]
      ]),
      settings: { loanDays: "14", maxBooks: "5", finePerDay: "$0.50", holdPeriod: "3 days" },
      staff: rows(["name", "role", "status"], [["Alex Morgan", "Administrator", STATUS.ACTIVE], ["Sarah Mitchell", "Librarian", STATUS.ACTIVE], ["Jamie Rivera", "Librarian", STATUS.ACTIVE]]),
      history: [],
      accounts: [],
      notices: [],
      audit: [],
      pw: {}
    };

    const NAV_ICONS = {
      Dashboard: "📊", "Book search": "🔍", "Book management": "📚", "Reader management": "👥", "Borrow book": "📤",
      "Return book": "📥", Reservations: "🔖", Fines: "💳", Reports: "📈", "Accounts & settings": "⚙️", "My account": "👤", Profile: "🪪", "Activity log": "🕒"
    };
    const STAT_ICONS = {
      "Books On Loan": "📖", "Active Readers": "👥", "Overdue Loans": "⏰", "Unpaid Fines": "💰",
      "Active Reservations": "🔖", "Ready for Pickup": "📬", "In Queue": "⏳", "Expiring Soon": "⚠️",
      "Books Borrowed": "📤", "Books Returned": "📥", "New Readers": "🆕", "Fines Collected": "💵"
    };

    const STAFF_PAGES = ["Dashboard", "Book search", "Book management", "Reader management", "Borrow book", "Return book", "Reservations", "Fines", "Reports"];
    const ROLE_MENUS = {
      Librarian: [...STAFF_PAGES, "Profile"],
      Reader: ["Book search", "My account"],
      Administrator: [...STAFF_PAGES, "Accounts & settings", "Activity log", "Profile"]
    };
    const ROLE_USERS = {
      Librarian: { name: "Sarah Mitchell", initials: "SM", user: "sarah.mitchell" },
      Reader: { name: "Emma Wilson", initials: "EW", user: "emma.wilson" },
      Administrator: { name: "Alex Morgan", initials: "AM", user: "alex.morgan" }
    };

    /**
     * state.js — Application state (`ui`, `db`) and localStorage persistence.
     */

    const ui = { role: "Librarian", page: "Dashboard", loanIndex: 0, readerIndex: 0, bookIndex: -1 };
    let db = loadData();

    /** Load saved data from localStorage, falling back to the seed data. */
    function loadData() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return saved ? { ...structuredClone(DEFAULT_DATA), ...saved } : structuredClone(DEFAULT_DATA);
      } catch {
        return structuredClone(DEFAULT_DATA);
      }
    }

    /** Persist the current data to localStorage (ignored if storage is unavailable). */
    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch { /* storage unavailable */ }
    }

    /**
     * utils.js — Formatting helpers and business-rule getters (settings, dates, fines).
     */

    const $ = (selector) => document.querySelector(selector);
    const esc = (value) => String(value ?? "")
      .replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const scale = (values) => { const peak = Math.max(...values); return values.map((v) => (peak ? Math.max(4, Math.round(v / peak * 100)) : 0)); };
    const money = (n) => "$" + n.toFixed(2);
    const unpaidTotal = () => db.fines.filter((f) => f.status === STATUS.UNPAID).reduce((s, f) => s + f.amount, 0);
    const num = (v) => parseFloat(String(v).replace(/[^0-9.]/g, "")) || 0;
    const finePerDay = () => num(db.settings.finePerDay);
    const maxBooks = () => num(db.settings.maxBooks);
    /** Due date = today + configured loan period. */
    const dueDate = () => {
      const d = new Date(TODAY_DATE);
      d.setDate(d.getDate() + num(db.settings.loanDays));
      return formatDate(d);
    };
    /** Next free reader card ID (R-xxxxx). */
    const nextCard = () => "R-" + (Math.max(10481, ...db.readers.map((r) => num(r.card))) + 1);
    const setting = (k) => db.settings[k] ?? ({ adultFee: "$10", studentFee: "$5", studentDiscount: "50%" })[k] ?? DEFAULT_DATA.settings[k];
    const readerName = () => ui.readerName || ROLE_USERS.Reader.name;
    /** Queue an in-app notification for a reader card. */
    const notify = (card, msg) => db.notices.unshift({ card, msg, date: TODAY });
    const memberFee = (type) => num(setting(type === "Student" ? "studentFee" : "adultFee"));
    const discount = () => Math.min(num(setting("studentDiscount")), 100) / 100;
    const readerOf = (card) => db.readers.find((r) => r.card === card);
    /** Fine per day depends on the membership type (students get a discount). */
    const fineRateFor = (card) => finePerDay() * (readerOf(card)?.type === "Student" ? 1 - discount() : 1);
    /** Replacement price of a book (default $15 when unknown). */
    const bookPrice = (title) => { const b = db.books.find((x) => x.title === title); return b && b.price > 0 ? b.price : 15; };
    const initialsOf = (n) => n.split(" ").map((w) => w[0]).join("").slice(0, 2).toUpperCase();
    /** Match demo accounts and self-registered reader accounts. */
    function findAccount(role, user, pass) {
      const d = ROLE_USERS[role];
      if (user === d.user && pass === (db.pw[user] ?? DEMO_PASSWORD)) return { name: d.name, initials: d.initials, user };
      const a = db.accounts.find((x) => (x.role || "Reader") === role && x.user === user && x.pass === pass);
      return a ? { name: a.name, initials: initialsOf(a.name), user } : null;
    }
    const MONTHS = "Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
    const parseDate = (s) => { const [d, m, y] = String(s).split(" "); return new Date(+y, MONTHS.indexOf(m), +d); };
    const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
    const daysLate = (loan) => { const d = parseDate(loan.due); return isNaN(d) ? 0 : Math.max(0, Math.round((TODAY_DATE - d) / 864e5)); };
    const logEvent = (type, book = "", card = "") => db.history.push({ type, date: TODAY, book, card });
    /** Days left on a reservation hold (negative = hold expired). */
    const holdLeft = (r) => Math.round((addDays(parseDate(r.date), num(db.settings.holdPeriod)) - TODAY_DATE) / 864e5);
    /** Keep loan statuses in sync with their due dates. */
    function refreshOverdue() {
      db.loans.forEach((l) => { if (daysLate(l) > 0) l.status = STATUS.OVERDUE; else if (l.status === STATUS.OVERDUE) l.status = STATUS.ON_LOAN; });
    }
    /** Borrow/return counts for the last n days (real data from db.history). */
    function circulation(n) {
      return Array.from({ length: n }, (_, k) => {
        const d = addDays(TODAY_DATE, k - n + 1), full = formatDate(d);
        const count = (t) => db.history.filter((h) => h.type === t && h.date === full).length;
        return { full, label: `${d.getDate()} ${MONTHS[d.getMonth()]}`, short: d.toLocaleString("en-US", { weekday: "short" }), borrowed: count("borrow"), returned: count("return") };
      });
    }

    // Filter table rows of a card by its search box (text) and status dropdown (exact badge text)
    /** Filter the table rows of a card by its search box (text) and status dropdown (exact badge text). */
    function applyFilter(card) {
      const text = (card.querySelector("input[data-filter]")?.value || "").trim().toLowerCase();
      const sel = card.querySelector("select[data-filter]")?.value || "";
      const status = /^All/.test(sel) ? "" : sel.toLowerCase();
      card.querySelectorAll("tbody tr").forEach((row) => {
        const badgeText = row.querySelector(".badge")?.textContent.toLowerCase();
        row.hidden = !(row.textContent.toLowerCase().includes(text) && (!status || badgeText === status));
      });
    }

    /** Return a coloured status badge as HTML. */
    function badge(status) {
      let color = "blue";
      if (/Overdue|Unpaid|Expired|Suspended/.test(status)) color = "red";
      else if (/Active|Available|Paid|Returned|Ready/.test(status)) color = "green";
      else if (/queue|loan/.test(status)) color = "yellow";
      return `<span class="badge ${color}">${esc(status)}</span>`;
    }

    function showToast(message) {
      const el = $("#toast");
      el.textContent = message;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), TOAST_MS);
    }

    /**
     * components.js — Small HTML-building helpers shared by every page.
     */

    const tr = (cells) => `<tr>${cells.map((c) => `<td>${c}</td>`).join("")}</tr>`;

    const pageHeader = (title, description, actionHtml = "") => `
      <div class="crumb">Workspace › ${title}</div>
      <div class="heading"><div><h1>${title}</h1><p>${description}</p></div>${actionHtml}</div>`;

    const statCard = (label, value, note = "") => `
      <div class="card" data-icon="${STAT_ICONS[label] || "📌"}"><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`;

    const table = (headers, bodyRows) => `
      <div class="table-wrap"><table>
        <thead><tr>${headers.map((h) => `<th scope="col">${h}</th>`).join("")}</tr></thead>
        <tbody>${bodyRows || "<tr><td>No data available</td></tr>"}</tbody>
      </table></div>`;

    const barChart = (values, labels = []) => {
      const peak = Math.max(...values);
      const cols = values.map((h, i) => `<div class="bcol" title="${esc(labels[i] ?? h)}">
        <div class="bar${h === peak ? " peak" : ""}" style="height:${h}%;--i:${i}"></div>${labels[i] ? `<span>${esc(labels[i])}</span>` : ""}</div>`);
      return `<div class="chart">${cols.join("")}</div>`;
    };

    let fieldCounter = 0;

    /** Labelled form control. The label is linked to the first input/select via `for`/`id`. */
    const field = (label, control) => {
      const existing = control.match(/\sid="([^"]+)"/);
      const id = existing ? existing[1] : `field-${++fieldCounter}`;
      const html = existing ? control : control.replace(/<(input|select)/, `<$1 id="${id}"`);
      return `<div class="field"><label for="${id}">${label}</label>${html}</div>`;
    };

    /**
     * services.js — Business logic: loans, returns, reservations, readers, fines, export.
     */

    /** Quote a CSV value when it contains a comma, quote or line break. */
    const csvCell = (value) => (/[",\n]/.test(value) ? `"${String(value).replaceAll('"', '""')}"` : value);

    /** Return an error message for invalid book form data, or "" when the data is valid. */
    function validateBook(form, skip) {
      const isbn = String(form.get("isbn") || "").replace(/[-\s]/g, "");
      const year = Number(form.get("year") || TODAY_DATE.getFullYear());
      const copies = Number(form.get("copies") || 1);
      if (isbn && !/^(\d{10}|\d{13})$/.test(isbn)) return "ISBN must have 10 or 13 digits";
      if (isbn && db.books.some((b) => b.isbn === isbn && b !== skip)) return "ISBN already exists";
      if (!Number.isInteger(year) || year < 1000 || year > TODAY_DATE.getFullYear() + 1) return "Enter a valid publication year";
      if (!Number.isInteger(copies) || copies < 1) return "Copies must be at least 1";
      return "";
    }

    /** Persist data, optionally re-render the current page, then show a toast. */
    const commit = (message, rerender = true) => {
      refreshOverdue();
      db.audit.unshift({ date: TODAY, who: ui.userName || "System", role: ui.role, msg: message });
      db.audit.length = Math.min(db.audit.length, 200);
      saveData();
      if (rerender) renderCurrentPage();
      showToast(message);
    };

    const Library = {
      /** Place a reservation for the book at `index` in the catalog. */
      reserve(index) {
        const book = db.books[index];
        const reader = readerName();
        if (readerOf(db.readers.find((r) => r.name === reader)?.card)?.status === "Suspended") return showToast("Your card is suspended");
        if (db.reservations.some((r) => r.book === book.title && r.reader === reader)) {
          return showToast("You already reserved this book");
        }
        const status = book.available > 0 ? STATUS.READY : STATUS.QUEUED;
        db.reservations.push({ book: book.title, reader, date: TODAY, status });
        commit("Reservation created", false);
      },
      /** Cancel the reservation at `index`. */
      cancelReservation(index) {
        if (!db.reservations[index]) return;
        db.reservations.splice(index, 1);
        commit("Reservation cancelled");
      },
      /** Turn a ready reservation into a loan. */
      fulfil(index) {
        const r = db.reservations[index];
        if (!r) return;
        if (r.status !== STATUS.READY) return showToast("Reservation is not ready yet");
        const reader = db.readers.find((x) => x.name === r.reader);
        if (!reader) return showToast("Reader not found");
        const before = db.loans.length;
        this.borrow(reader.card, r.book);
        if (db.loans.length > before) {
          db.reservations.splice(db.reservations.indexOf(r), 1);
          commit("Reservation fulfilled");
        }
      },
      /** Extend a loan once, unless it is overdue or another reader is waiting. */
      renew(index) {
        const l = db.loans[index];
        if (!l) return;
        if (daysLate(l) > 0) return showToast("Overdue loans can't be renewed");
        if (l.renewed) return showToast("Loan already renewed once");
        if (db.reservations.some((r) => r.book === l.book && r.status === STATUS.QUEUED)) return showToast("Another reader is waiting for this book");
        l.due = formatDate(addDays(parseDate(l.due), num(db.settings.loanDays)));
        l.renewed = true;
        commit("Loan renewed");
      },
      /** Create a loan after checking card status, borrow limit and stock. */
      borrow(card, title) {
        const reader = db.readers.find((r) => r.card === card);
        const book = db.books.find((b) => b.title === title);
        if (!reader) return showToast("Reader not found");
        if (reader.status !== STATUS.ACTIVE) return showToast("Reader card is not active");
        if (parseDate(reader.expires) < TODAY_DATE) return showToast("Membership expired - renew it first");
        if (db.loans.filter((l) => l.card === card).length >= maxBooks()) return showToast("Borrow limit reached");
        if (!book || book.available < 1) return showToast("No copies available");
        book.available--;
        logEvent("borrow", book.title, reader.card);
        db.loans.unshift({ book: book.title, reader: reader.name, card: reader.card, due: dueDate(), status: STATUS.ON_LOAN });
        ui.loanIndex = 0;
        commit("Loan created");
      },
      /** Return the selected loan: restock, promote the queue, fine late/damaged/lost books. */
      returnBook() {
        const loan = db.loans[ui.loanIndex] || db.loans[0];
        if (!loan) return showToast("No active loans");
        const condition = $("#condition")?.value || "";
        const lost = condition.startsWith("Lost"), damaged = condition.startsWith("Damaged");
        db.loans.splice(db.loans.indexOf(loan), 1);
        const book = db.books.find((b) => b.title === loan.book);
        if (book) { if (lost) book.copies = Math.max(0, book.copies - 1); else book.available++; }
        const queued = !lost && db.reservations.find((r) => r.book === loan.book && r.status === STATUS.QUEUED);
        if (queued) {
          queued.status = STATUS.READY;
          const q = db.readers.find((x) => x.name === queued.reader);
          if (q) notify(q.card, `"${queued.book}" is now ready for pickup`);
        }
        const addFine = (reason, amount) => db.fines.push({ reader: loan.reader, card: loan.card, reason, amount, status: STATUS.UNPAID });
        const late = daysLate(loan);
        const hasFine = db.fines.some((f) => f.card === loan.card && f.status === STATUS.UNPAID && /overdue/i.test(f.reason));
        const price = bookPrice(loan.book);
        if (late > 0 && !hasFine) addFine(`${late} days overdue`, Math.min(late * fineRateFor(loan.card), price));
        if (lost) addFine("Lost book", price); else if (damaged) addFine("Damaged book", Math.round(price * 25) / 100);
        logEvent("return", loan.book, loan.card);
        ui.loanIndex = 0;
        commit("Return confirmed");
      },
      /** Waive the unpaid overdue fine belonging to the selected loan. */
      waiveFine() {
        const loan = db.loans[ui.loanIndex] || db.loans[0];
        const fine = loan && db.fines.find((f) => f.card === loan.card && f.status === STATUS.UNPAID && /overdue/i.test(f.reason));
        if (!fine) return showToast("No fine to waive");
        fine.status = STATUS.WAIVED;
        commit("Fine waived");
      },
      /** Add a new book, or update the selected one. */
      saveBook(form) {
        const cur = db.books[ui.bookIndex];
        const error = validateBook(form, cur);
        if (error) return showToast(error);
        const copies = Number(form.get("copies") || 1);
        const data = {
          title: form.get("title").trim(), author: form.get("author").trim(),
          isbn: String(form.get("isbn") || "").replace(/[-\s]/g, ""), category: form.get("category").trim() || "General",
          year: Number(form.get("year") || TODAY_DATE.getFullYear()), copies,
          price: Number(form.get("price")) > 0 ? Number(form.get("price")) : 15
        };
        if (cur) {
          const out = cur.copies - cur.available;
          if (copies < out) return showToast(`${out} copies are on loan; copies can't be lower`);
          Object.assign(cur, data, { available: copies - out });
        } else {
          db.books.unshift({ ...data, available: copies, shelf: "MAIN" });
        }
        ui.bookIndex = -1;
        commit(cur ? "Book updated" : "Book saved");
      },
      deleteBook() {
        const b = db.books[ui.bookIndex];
        if (!b) return showToast("Select a book first");
        if (db.loans.some((l) => l.book === b.title)) return showToast("Book is currently on loan");
        if (!confirm(`Delete "${b.title}"?`)) return;
        db.books.splice(ui.bookIndex, 1);
        ui.bookIndex = -1;
        commit("Book deleted");
      },
      toggleReader() {
        const r = db.readers[ui.readerIndex];
        if (!r) return;
        r.status = r.status === STATUS.ACTIVE ? "Suspended" : STATUS.ACTIVE;
        commit(r.status === STATUS.ACTIVE ? "Reader activated" : "Reader suspended");
      },
      deleteReader() {
        const r = db.readers[ui.readerIndex];
        if (!r) return;
        if (db.loans.some((l) => l.card === r.card)) return showToast("Reader still has books on loan");
        if (!confirm(`Delete reader ${r.name}?`)) return;
        db.readers.splice(ui.readerIndex, 1);
        ui.readerIndex = 0;
        commit("Reader deleted");
      },
      addStaff(form) {
        const name = form.get("name").trim();
        if (db.staff.some((s) => s.name.toLowerCase() === name.toLowerCase())) return showToast("Staff member already exists");
        db.staff.push({ name, role: form.get("role"), status: STATUS.ACTIVE });
        commit("Staff added");
      },
      toggleStaff(i) {
        const s = db.staff[i];
        if (!s) return;
        const next = s.status === STATUS.ACTIVE ? "Suspended" : STATUS.ACTIVE;
        const admins = db.staff.filter((x) => x.role === "Administrator" && x.status === STATUS.ACTIVE).length;
        if (next !== STATUS.ACTIVE && s.role === "Administrator" && admins < 2) return showToast("At least one active administrator is required");
        s.status = next;
        commit(next === STATUS.ACTIVE ? "Account activated" : "Account deactivated");
      },
      /** Download the 7-day circulation report as CSV. */
      exportReportCsv() {
        const body = circulation(7).map((d) => [d.full, d.borrowed, d.returned, d.borrowed - d.returned].join(",")).join("\n");
        download("circulation-report.csv", "Date,Borrowed,Returned,Net\n" + body, "text/csv");
      },
      changePassword(form) {
        const next = form.get("next");
        if (!findAccount(ui.role, ui.userKey, form.get("current"))) return showToast("Current password is wrong");
        if (next.length < 6) return showToast("New password needs at least 6 characters");
        if (next !== form.get("confirm")) return showToast("Passwords do not match");
        const a = db.accounts.find((x) => x.user === ui.userKey);
        if (a) a.pass = next; else db.pw[ui.userKey] = next;
        commit("Password changed");
      },
      /** Notify readers whose loans are overdue or due within 2 days. */
      sendReminders() {
        let n = 0;
        db.loans.forEach((l) => {
          const late = daysLate(l), left = Math.round((parseDate(l.due) - TODAY_DATE) / 864e5);
          if (late > 0) { notify(l.card, `"${l.book}" is ${late} day(s) overdue`); n++; }
          else if (left <= 2) { notify(l.card, `"${l.book}" is due on ${l.due}`); n++; }
        });
        commit(n ? `${n} reminder(s) sent` : "No loans need reminders");
      },
      notifyReservation(i) {
        const r = db.reservations[i], rd = r && db.readers.find((x) => x.name === r.reader);
        if (!rd) return showToast("Reader not found");
        notify(rd.card, r.status === STATUS.READY ? `"${r.book}" is ready for pickup (${Math.max(0, holdLeft(r))} day(s) left)` : `You are in the queue for "${r.book}"`);
        commit(`Notification sent to ${r.reader}`, false);
      },
      clearNotices() {
        const card = db.readers.find((r) => r.name === readerName())?.card;
        db.notices = db.notices.filter((n) => n.card !== card);
        commit("Notifications cleared");
      },
      exportBackup() { download("northbridge-backup.json", JSON.stringify(db, null, 2), "application/json"); },
      restore(file) {
        if (!file) return;
        file.text().then((t) => {
          try {
            const o = JSON.parse(t);
            if (!Array.isArray(o.books) || !Array.isArray(o.readers)) throw new Error("bad");
            db = { ...structuredClone(DEFAULT_DATA), ...o };
            commit("Backup restored");
          } catch { showToast("Invalid backup file"); }
        });
      },
      resetData() {
        if (!confirm("Reset ALL data to the demo defaults?")) return;
        db = structuredClone(DEFAULT_DATA);
        commit("Data reset to defaults");
      },
      /** Update the reader with the given card ID, or register a new one. */
      saveReader(form) {
        const card = form.get("card").trim();
        const data = { name: form.get("name").trim(), email: form.get("email").trim(), type: form.get("type") };
        if (!/^R-\d{5}$/.test(card)) return showToast("Card ID must look like R-10482");
        if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) return showToast("Enter a valid email address");
        let i = db.readers.findIndex((r) => r.card === card);
        if (i >= 0) {
          Object.assign(db.readers[i], data);
        } else {
          const expires = new Date(TODAY_DATE);
          expires.setFullYear(expires.getFullYear() + 1);
          db.readers.push({ ...data, card, status: STATUS.ACTIVE, expires: formatDate(expires), joined: TODAY });
          i = db.readers.length - 1;
        }
        ui.readerIndex = i;
        commit("Reader saved");
      },
      /** Mark the fine at `index` as paid. */
      payFine(index) {
        const fine = db.fines[index];
        if (!fine || fine.status !== STATUS.UNPAID) return showToast("No unpaid fine selected");
        fine.status = STATUS.PAID;
        fine.method = $("#payMethod")?.value || "Cash";
        fine.paidOn = TODAY;
        commit("Payment recorded");
      },
      /** Pay every unpaid fine of the selected fine's reader. */
      payAll(index) {
        const f = db.fines[index];
        if (!f || f.status !== STATUS.UNPAID) return showToast("No unpaid fine selected");
        const list = db.fines.filter((x) => x.card === f.card && x.status === STATUS.UNPAID);
        list.forEach((x) => { x.status = STATUS.PAID; x.method = $("#payMethod")?.value || "Cash"; x.paidOn = TODAY; });
        commit(`${list.length} fine(s) paid - ${money(list.reduce((t, x) => t + x.amount, 0))}`);
      },
      addFine(form) {
        const r = readerOf(form.get("card")), amount = Number(form.get("amount"));
        if (!r) return showToast("Reader not found");
        if (!(amount > 0)) return showToast("Enter a valid amount");
        db.fines.push({ reader: r.name, card: r.card, reason: form.get("reason").trim() || "Manual fine", amount, status: STATUS.UNPAID });
        commit("Fine added");
      },
      renewMembership() {
        const r = db.readers[ui.readerIndex];
        if (!r) return;
        const fee = memberFee(r.type), from = Math.max(parseDate(r.expires), TODAY_DATE);
        r.expires = formatDate(addDays(from, 365));
        db.fines.push({ reader: r.name, card: r.card, reason: `Membership renewal (${r.type})`, amount: fee, status: STATUS.UNPAID });
        commit(`Membership renewed - fee ${money(fee)} added to fines`);
      },
      /** Download the catalog as a CSV file. */
      exportBooksCsv() {
        const header = "Title,Author,ISBN,Category,Year,Copies,Available\n";
        const body = db.books.map((b) => [b.title, b.author, b.isbn, b.category, b.year, b.copies, b.available].map(csvCell).join(",")).join("\n");
        download("library.csv", header + body, "text/csv");
      }
    };

    /** Trigger a browser download for in-memory content. */
    function download(filename, content, type) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(new Blob([content], { type }));
      link.download = filename;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }

        </form>
      </div>`;

    function renderProfilePage() {
      return pageHeader("Profile", "Your staff account and security.") + `
        <div class="grid2">
          <div class="card">
            <h2>Account</h2>
            <div class="avatar mb-sm">${esc(initialsOf(ui.userName || "?"))}</div>
            <p><b>${esc(ui.userName)}</b></p>
            <p>Role: ${esc(ui.role)}</p>
            <p>Username: ${esc(ui.userKey)}</p>
          </div>
          ${passwordCard()}
        </div>`;
    }

    function renderActivityPage() {
      const rowsHtml = db.audit.map((a) => tr([esc(a.date), esc(a.who), esc(a.role), esc(a.msg)])).join("");
      return pageHeader("Activity log", "Who did what in the system (last 200 actions).",
        `<div class="actions"><button class="btn secondary" data-action="clearLog">Clear log</button></div>`) + `
        <div class="card">
          <div class="toolbar"><input data-filter aria-label="Search activity" placeholder="Search activity"></div>
          ${table(["Date", "User", "Role", "Action"], rowsHtml)}
        </div>`;
    }

    const PAGE_RENDERERS = {
      Profile: renderProfilePage,
      "Activity log": renderActivityPage,
      Dashboard: renderDashboard,
      "Book search": renderSearchPage,
      "Book management": renderBookManagement,
      "Reader management": renderReaderManagement,
      "Borrow book": renderBorrowPage,
      "Return book": renderReturnPage,
      Reservations: renderReservationPage,
      Fines: renderFinesPage,
      Reports: renderReportPage,
      "Accounts & settings": renderSettingsPage,
      "My account": renderMyAccount
    };

    /**
     * app.js — Navigation, page rendering, event delegation and start-up. Loaded last.
     */

    function setupNavigation() {
      $("#nav").innerHTML = ROLE_MENUS[ui.role]
        .map((p) => `<button data-page="${p}" class="${ui.page === p ? "active" : ""}"${ui.page === p ? ' aria-current="page"' : ""}><span class="ni">${NAV_ICONS[p] || "•"}</span>${p}</button>`).join("");
    }

    // Count stat numbers up from zero
    function animateNumbers() {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      document.querySelectorAll("#main .stat-value").forEach((el) => {
        const m = el.textContent.match(/^(\$?)([\d,]+(?:\.(\d+))?)$/);
        if (!m) return;
        const target = parseFloat(m[2].replace(/,/g, "")), decimals = (m[3] || "").length, grouped = m[2].includes(",");
        const start = performance.now();
        const tick = (now) => {
          const t = Math.min(1, (now - start) / COUNT_UP_MS);
          const value = target * (1 - Math.pow(1 - t, 3));
          el.textContent = m[1] + value.toLocaleString("en-US", { minimumFractionDigits: decimals, maximumFractionDigits: decimals, useGrouping: grouped });
          if (t < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }

    /** Render the active page. Pass animate = true on page changes only (not after saving data). */
    function renderCurrentPage(animate = false) {
      const render = PAGE_RENDERERS[ui.page];
      if (!render) return;
      const main = $("#main");
      main.innerHTML = render();
      main.classList.remove("enter");
      if (animate) {
        void main.offsetWidth;
        main.classList.add("enter");
        animateNumbers();
      }
    }

    /** Switch the active page and re-render with the entrance animation. */
    function navigate(page) {
      ui.page = page;
      setupNavigation();
      renderCurrentPage(true);
    }

    const ACTIONS = {
      goto: (el) => navigate(el.dataset.value),
      reserve: (el) => Library.reserve(Number(el.dataset.value)),
      clearSearch: () => { $("#searchBook").value = ""; $("#searchCat").value = ""; $("#searchAvail").value = "All books"; $("#searchResult").innerHTML = searchTable(); },
      findReader: () => {
        const card = $("#borrowForm").elements.card.value;
        const reader = db.readers.find((r) => r.card === card);
        const count = reader ? db.loans.filter((l) => l.card === reader.card).length : 0;
        $("#readerPreview").innerHTML = reader
          ? `<b>${esc(reader.name)}</b> — ${esc(reader.status)} card — Currently borrowing ${count} books`
          : "Reader not found";
      },
      findLoan: () => {
        const q = $("#barcode").value.trim().toLowerCase();
        const i = q ? db.loans.findIndex((l) => l.book.toLowerCase().includes(q) || l.card.toLowerCase() === q) : -1;
        if (i < 0) return showToast("Loan not found");
        ui.loanIndex = i;
        renderCurrentPage();
        showToast("Loan found");
      },
      confirmReturn: () => Library.returnBook(),
      waiveFine: () => Library.waiveFine(),
      pickReader: (el) => { ui.readerIndex = Number(el.dataset.value); renderCurrentPage(); },
      newReader: () => { ui.readerIndex = -1; renderCurrentPage(); },
      notify: (el) => Library.notifyReservation(Number(el.dataset.value)),
      cancelRes: (el) => Library.cancelReservation(Number(el.dataset.value)),
      fulfil: (el) => Library.fulfil(Number(el.dataset.value)),
      renew: (el) => Library.renew(Number(el.dataset.value)),
      newBook: () => { ui.bookIndex = -1; renderCurrentPage(); $("#bookForm input")?.focus(); },
      pickBook: (el) => { ui.bookIndex = Number(el.dataset.value); renderCurrentPage(); },
      deleteBook: () => Library.deleteBook(),
      toggleReader: () => Library.toggleReader(),
      deleteReader: () => Library.deleteReader(),
      renewMember: () => Library.renewMembership(),
      sendReminders: () => Library.sendReminders(),
      clearNotices: () => Library.clearNotices(),
      clearLog: () => { db.audit = []; commit("Log cleared"); },
      exportBackup: () => Library.exportBackup(),
      resetData: () => Library.resetData(),
      payAll: () => Library.payAll(Number($("#payReader").value)),
      toggleStaff: (el) => Library.toggleStaff(Number(el.dataset.value)),
      payFine: () => Library.payFine(Number($("#payReader").value)),
      saveSettings: () => {
        const inputs = [...document.querySelectorAll("[data-setting]")];
        if (inputs.some((i) => num(i.value) <= 0)) return showToast("Enter valid values");
        inputs.forEach((i) => { db.settings[i.dataset.setting] = i.value.trim(); });
        commit("Settings saved");
      },
      exportCsv: () => Library.exportReportCsv(),
      exportBooks: () => Library.exportBooksCsv(),
      print: () => window.print()
    };

    const FORMS = {
      borrowForm: (data) => Library.borrow(data.get("card"), data.get("book")),
      bookForm: (data) => Library.saveBook(data),
      staffForm: (data) => Library.addStaff(data),
      fineForm: (data) => Library.addFine(data),
      passwordForm: (data) => Library.changePassword(data),
      readerForm: (data) => Library.saveReader(data)
    };

    $("#loginForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const role = $("#role").value, account = findAccount(role, $("#username").value.trim().toLowerCase(), $("#password").value);
      if (!account) return showToast("Wrong username, password or role");
      const staff = db.staff.find((s) => s.name === account.name);
      if (role !== "Reader" && staff && staff.status !== STATUS.ACTIVE) return showToast("This account is deactivated");
      ui.role = role; ui.userName = account.name; ui.userKey = account.user; ui.home = { role, name: account.name, user: account.user };
      $("#switchRole").value = role;
      ui.readerName = role === "Reader" ? account.name : null; ui.bookIndex = -1; ui.readerIndex = 0; ui.loanIndex = 0;
      commit("Welcome, " + account.name, false);
      const user = account;
      $("#displayName").textContent = user.name;
      $("#avatar").textContent = user.initials;
      ui.page = ui.role === "Reader" ? "Book search" : "Dashboard";
      $("#login").classList.add("hidden");
      $("#app").classList.remove("hidden");
      setupNavigation();
      renderCurrentPage(true);
    });

    const toggleAuth = (register) => {
      $("#loginForm").classList.toggle("hidden", register);
      $("#registerForm").classList.toggle("hidden", !register);
      if (register) updateRegFee();
    };
    function updateRegFee() {
      const t = $("#regType").value, staff = $("#regRole").value !== "Reader";
      $("#regType").closest(".field").classList.toggle("hidden", staff);
      if (staff) { $("#regFee").textContent = "Staff accounts can sign in right after registering."; return; }
      $("#regFee").innerHTML = `Membership fee: <b>${money(memberFee(t))}</b>${t === "Student" ? ` - overdue fines are ${Math.round((1 - discount()) * 100)}% of the standard rate` : ""}`;
    }
    $("#showRegister").addEventListener("click", () => toggleAuth(true));
    $("#showLogin").addEventListener("click", () => toggleAuth(false));
    $("#regType").addEventListener("change", updateRegFee);
    $("#regRole").addEventListener("change", updateRegFee);
    $("#showForgot").addEventListener("click", () => {
      const user = (prompt("Username:") || "").trim().toLowerCase();
      if (!user) return;
      const email = (prompt("Email on the account:") || "").trim().toLowerCase();
      const a = db.accounts.find((x) => x.user === user && String(x.email || readerOf(x.card)?.email || "").toLowerCase() === email);
      if (!a) return showToast("No matching account (demo accounts can't be reset)");
      const pass = prompt("New password (min 6 characters):") || "";
      if (pass.length < 6) return showToast("Password too short");
      a.pass = pass; saveData(); showToast("Password reset - please sign in");
    });
    $("#registerForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const f = new FormData(event.target), name = f.get("name").trim(), email = f.get("email").trim();
      const user = f.get("user").trim().toLowerCase(), pass = f.get("pass"), type = f.get("type"), role = f.get("role");
      if (!/^[a-z0-9._]{4,20}$/.test(user)) return showToast("Username: 4-20 letters, digits, . or _");
      if (Object.values(ROLE_USERS).some((u) => u.user === user) || db.accounts.some((a) => a.user === user)) return showToast("Username already taken");
      if (db.readers.some((r) => r.name.toLowerCase() === name.toLowerCase()) || db.staff.some((x) => x.name.toLowerCase() === name.toLowerCase())) return showToast("A reader with this name already exists");
      if (db.readers.some((r) => r.email.toLowerCase() === email.toLowerCase())) return showToast("Email already registered");
      if (pass.length < 6) return showToast("Password needs at least 6 characters");
      if (pass !== f.get("confirm")) return showToast("Passwords do not match");
      if (role !== "Reader") {
        db.staff.push({ name, role, status: STATUS.ACTIVE });
        db.accounts.push({ user, pass, name, role, email });
        saveData(); event.target.reset(); toggleAuth(false);
        $("#role").value = role; $("#username").value = user; $("#password").value = "";
        return showToast(`${role} account created - you can sign in now`);
      }
      const card = nextCard();
      db.readers.push({ name, card, email, type, status: STATUS.ACTIVE, expires: formatDate(addDays(TODAY_DATE, 365)), joined: TODAY });
      db.accounts.push({ user, pass, name, card });
      db.fines.push({ reader: name, card, reason: `Membership fee (${type})`, amount: memberFee(type), status: STATUS.UNPAID });
      saveData();
      event.target.reset();
      toggleAuth(false);
      $("#role").value = "Reader"; $("#username").value = user; $("#password").value = "";
      showToast(`Account created - card ${card}. Please sign in.`);
    });

    $("#switchRole").addEventListener("change", (e) => {
      const role = e.target.value, home = ui.home;
      if (role === ui.role) return;
      if (role !== "Reader" && role !== home.role) {
        const pw = prompt(`Enter the password for the ${role} role:`) || "";
        const ok = pw && (pw === (db.pw[ROLE_USERS[role].user] ?? DEMO_PASSWORD) || db.accounts.some((a) => a.role === role && a.pass === pw));
        if (!ok) { e.target.value = ui.role; return showToast("Role change cancelled - wrong password"); }
      }
      const own = role === home.role;
      ui.role = role;
      ui.userName = own ? home.name : ROLE_USERS[role].name;
      ui.userKey = own ? home.user : ROLE_USERS[role].user;
      ui.readerName = role === "Reader" ? (own ? home.name : ROLE_USERS.Reader.name) : null;
      $("#displayName").textContent = ui.userName;
      $("#avatar").textContent = initialsOf(ui.userName);
      ui.page = role === "Reader" ? "Book search" : "Dashboard";
      setupNavigation();
      renderCurrentPage(true);
      commit(`Switched role to ${role}`, false);
    });

    $("#role").addEventListener("change", () => { $("#username").value = ROLE_USERS[$("#role").value].user; });

    $("#logout").addEventListener("click", () => {
      $("#app").classList.add("hidden");
      $("#login").classList.remove("hidden");
    });

    $("#nav").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (button) navigate(button.dataset.page);
    });

    $("#main").addEventListener("click", (event) => {
      const el = event.target.closest("[data-action]");
      if (el) ACTIONS[el.dataset.action]?.(el);
    });

    ["input", "change"].forEach((type) => $("#main").addEventListener(type, (event) => {
      if (event.target.id === "restoreFile" && event.type === "change") Library.restore(event.target.files[0]);
      if (["searchBook", "searchCat", "searchAvail"].includes(event.target.id)) $("#searchResult").innerHTML = searchTable($("#searchBook").value);
      if (event.target.matches("[data-filter]")) applyFilter(event.target.closest(".card"));
    }));

    $("#main").addEventListener("submit", (event) => {
      event.preventDefault();
      FORMS[event.target.id]?.(new FormData(event.target));
    });
    </script>
</body>
</html>
